name: Pacotes CertiJVM
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar biblioteca EGL do Qt no Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Instalar dependencias
        run: python -m pip install -e '.[dev]'
      - name: Compilar teste Java 8
        run: javac --release 8 -d src/jvmcert/java src/jvmcert/java/TlsProbe.java
      - name: Testar
        run: python -m pytest -q
      - name: Gerar pacote
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: CertiJVM-${{ matrix.os }}
          path: dist/CertiJVM-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: CertiJVM-*
          path: release-dist
          merge-multiple: true
      - name: Publicar pacotes da versao
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -f release-dist/CertiJVM-Windows.zip
          test -f release-dist/CertiJVM-Linux.zip
          gh release create "$GITHUB_REF_NAME" \
            release-dist/CertiJVM-Windows.zip \
            release-dist/CertiJVM-Linux.zip \
            --verify-tag --generate-notes
