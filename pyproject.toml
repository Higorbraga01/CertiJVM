[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certijvm"
version = "0.1.0"
description = "Gerenciador gráfico de certificados para JVMs"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7", "cryptography>=42,<47", "pyOpenSSL>=24,<27"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
certijvm = "jvmcert.app:main"
jvmcert-manager = "jvmcert.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jvmcert = ["java/*.class"]

[tool.pytest.ini_options]
testpaths = ["tests"]
